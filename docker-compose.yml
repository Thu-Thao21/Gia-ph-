version: '3.8'

services:
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: mfg-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://neondb_owner:npg_XkwBJVU8WF4e@ep-green-mode-b4ugmgu4-pooler.c-6.us-east-2.aws.neon.tech/mfgms_ai?sslmode=require&channel_binding=require}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey123_mfgms_genealogy_2026}
      SESSION_TTL_HOURS: 8
      FRONTEND_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000"
      DEBUG: "false"
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: mfg-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      - backend

  # Dịch vụ Postgres cục bộ dự phòng (chỉ dùng nếu muốn chạy offline hoàn toàn)
  postgres:
    image: postgres:16-alpine
    container_name: mfg-postgres
    restart: unless-stopped
    profiles: ["offline"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: multi_family_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./BE/database/seed_neon_real_data.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    ports:
      - "5433:5432"

volumes:
  postgres-data:
